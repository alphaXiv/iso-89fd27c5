apiVersion: batch/v1
kind: Job
metadata:
  name: iso-repro-{{ORX_RUN}}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: reproduction
          image: nvcr.io/nvidia/pytorch:25.06-py3
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "24"
              memory: "96Gi"
            limits:
              nvidia.com/gpu: "4"
              cpu: "32"
              memory: "128Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
