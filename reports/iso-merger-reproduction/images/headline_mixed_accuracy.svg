<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Balanced held-out accuracy across five seeds</title>
  <desc id="desc">Task Arithmetic has 62.83 percent accuracy, ISO-Merger 62.03 percent, averaging 60.59 percent, and the base 54.55 percent.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="56" y="48" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">Held-out mixed accuracy</text>
  <text x="56" y="76" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5c667a">Balanced mean of GLUE SST-2 and QNLI; bars show mean ± sample SD across 5 independent seeds</text>
  <g stroke="#dfe4ec" stroke-width="1">
    <line x1="85" x2="855" y1="450" y2="450"/><line x1="85" x2="855" y1="380" y2="380"/>
    <line x1="85" x2="855" y1="310" y2="310"/><line x1="85" x2="855" y1="240" y2="240"/>
    <line x1="85" x2="855" y1="170" y2="170"/><line x1="85" x2="855" y1="100" y2="100"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#687386" text-anchor="end">
    <text x="77" y="455">54%</text><text x="77" y="385">56%</text><text x="77" y="315">58%</text>
    <text x="77" y="245">60%</text><text x="77" y="175">62%</text><text x="77" y="105">64%</text>
  </g>
  <rect x="130" y="431" width="120" height="19" rx="4" fill="#c8cfda"/>
  <rect x="320" y="219" width="120" height="231" rx="4" fill="#8b95a7"/>
  <rect x="510" y="169" width="120" height="281" rx="4" fill="#2575d8"/>
  <rect x="700" y="141" width="120" height="309" rx="4" fill="#e58a2b"/>
  <g stroke="#172033" stroke-width="2">
    <line x1="380" x2="380" y1="198" y2="241"/><line x1="366" x2="394" y1="198" y2="198"/><line x1="366" x2="394" y1="241" y2="241"/>
    <line x1="570" x2="570" y1="150" y2="188"/><line x1="556" x2="584" y1="150" y2="150"/><line x1="556" x2="584" y1="188" y2="188"/>
    <line x1="760" x2="760" y1="117" y2="165"/><line x1="746" x2="774" y1="117" y2="117"/><line x1="746" x2="774" y1="165" y2="165"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#172033">
    <text x="190" y="418">54.55%</text><text x="380" y="185">60.59%</text><text x="570" y="136">62.03%</text><text x="760" y="103">62.83%</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#344054">
    <text x="190" y="480">Shared base</text><text x="380" y="480">Weight average</text><text x="570" y="480">ISO-Merger</text><text x="760" y="480">Task Arithmetic</text>
  </g>
  <text x="570" y="205" font-family="Inter,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">+1.45 pp vs avg</text>
  <text x="760" y="181" font-family="Inter,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">+0.80 pp vs ISO</text>
</svg>
